<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✧･ﾟ Profil ﾟ･✧ | TWEWY Co-op</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ffd1e6;
    --purple:#e0157a;
    --blue:#ffe0ef;
    --cyan:#fff3d6;
    --yellow:#fff8ec;
    --hotpink:#ff208c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Montserrat',sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #ecdcff 0%, transparent 45%),
      radial-gradient(circle at 80% 10%, #ddd0ff 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #e6d9ff 0%, transparent 50%),
      linear-gradient(135deg, #e4d6ff 0%, #ecdcff 40%, #f2e8ff 70%, #ded0f7 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    position:relative;
    padding-bottom:80px;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    opacity:0;
    transition:opacity 1s ease;
    background:
      radial-gradient(circle at 20% 20%, #1f1d23 0%, transparent 45%),
      radial-gradient(circle at 80% 10%, #1f2a5c 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #232f66 0%, transparent 50%),
      linear-gradient(135deg, #131a3a 0%, #1a2350 40%, #202b5e 70%, #161d42 100%);
  }
  body.dark::after{ opacity:1; }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><g fill='white'><path d='M20 4 L23 15 L34 15 L25 22 L28 33 L20 26 L12 33 L15 22 L6 15 L17 15 Z'/><circle cx='90' cy='30' r='2.2'/><circle cx='60' cy='70' r='1.6'/><path d='M110 90 L112 96 L118 96 L113 100 L115 106 L110 102 L105 106 L107 100 L102 96 L108 96 Z'/><circle cx='25' cy='110' r='1.8'/><circle cx='75' cy='120' r='2.4'/><circle cx='130' cy='60' r='1.5'/></g></svg>");
    background-size:140px 140px;
    background-repeat:repeat;
    opacity:.55;
    animation:drift 40s linear infinite;
  }
  @keyframes drift{
    0%{background-position:0 0; opacity:.4;}
    50%{opacity:.65;}
    100%{background-position:-280px 280px; opacity:.4;}
  }

  .sparkle{
    position:fixed;
    pointer-events:none;
    font-size:28px;
    color:#ffffff;
    opacity:.9;
    animation:float 6s ease-in-out infinite;
    z-index:0;
    filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px rgba(255,255,255,.7));
    user-select:none;
  }
  @keyframes float{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(10px,-18px) rotate(10deg);}
    50%{transform:translate(-6px,-28px) rotate(-8deg);}
    75%{transform:translate(-14px,-12px) rotate(6deg);}
  }

  .marquee-wrap{
    width:100%;
    background:linear-gradient(90deg,var(--hotpink),var(--purple),var(--pink),var(--hotpink));
    background-size:300% 100%;
    animation:gradientshift 6s linear infinite;
    overflow:hidden;
    white-space:nowrap;
    border-bottom:4px solid #fff;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    position:relative;
    z-index:2;
  }
  @keyframes gradientshift{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
  }
  .marquee{
    display:inline-block;
    padding:8px 0;
    color:#fff;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:1px;
    text-shadow:0 0 6px rgba(255,255,255,.8), 2px 2px 0 rgba(0,0,0,.15);
    animation:scroll 18s linear infinite;
  }
  @keyframes scroll{
    0%{transform:translateX(100vw);}
    100%{transform:translateX(-100%);}
  }

  .topbar{
    max-width:935px;
    margin:0 auto;
    padding:14px 20px 0;
    position:relative;
    z-index:2;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .backlink{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:13px;
    color:#ff208c;
    text-decoration:none;
    background:rgba(255,255,255,.65);
    padding:7px 14px;
    border-radius:20px;
    box-shadow:0 2px 8px rgba(140,90,200,.2);
    transition:color .7s ease, background .7s ease, transform .15s ease;
  }
  .backlink:hover{ transform:translateY(-1px); }
  body.dark .backlink{ color:#d8d2e0; background:rgba(30,28,36,.6); }

  main{
    max-width:600px;
    margin:0 auto;
    padding:22px 20px 40px;
    position:relative;
    z-index:2;
  }

  .profile-header{
    display:flex;
    align-items:center;
    gap:28px;
    padding:24px 10px 30px;
    border-bottom:2px solid rgba(255,255,255,.6);
    transition:border-color .7s ease;
  }
  body.dark .profile-header{ border-color:rgba(255,255,255,.12); }
  @media (max-width:480px){
    .profile-header{ flex-direction:column; align-items:center; text-align:center; }
  }

  .avatar-ring{
    flex-shrink:0;
    width:150px;
    height:150px;
    border-radius:50%;
    padding:5px;
    background:conic-gradient(from 210deg, #ffd76b, var(--hotpink), var(--purple), var(--pink), #ffd76b);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 18px rgba(140,90,200,.3);
  }
  .avatar-ring .avatar-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:56px;
    overflow:hidden;
  }
  body.dark .avatar-ring .avatar-inner{ background:#1e1c24; }
  .avatar-ring .avatar-inner img{
    width:80%;
    height:80%;
    object-fit:contain;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));
  }

  .profile-meta{ flex:1; min-width:0; }
  .profile-name-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  @media (max-width:480px){
    .profile-name-row{ justify-content:center; }
  }
  .profile-username{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:24px;
    color:#141217;
    transition:color .7s ease;
    word-break:break-word;
  }
  body.dark .profile-username{ color:#fff8ec; }

  .pf-btn{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:13px;
    border:none;
    border-radius:10px;
    padding:8px 16px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,#7289da,#5865f2);
    box-shadow:0 3px 0 rgba(0,0,0,.12);
    transition:transform .1s ease, background .7s ease;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .pf-btn:active{ transform:translateY(2px); }
  .pf-btn.edit{ background:linear-gradient(135deg,#a988e8,#ff208c); }
  body.dark .pf-btn.edit{ background:linear-gradient(135deg,#2a2630,#1f1d23); }

  .bio{
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    color:#5c5866;
    line-height:1.5;
    max-width:420px;
    white-space:pre-wrap;
    transition:color .7s ease;
  }
  body.dark .bio{ color:#b9b3c4; }
  .badge-taken2{
    display:inline-block;
    background:linear-gradient(135deg,#b498e0,#8064c9);
    color:#fff;
    font-size:11px;
    font-weight:700;
    padding:3px 10px;
    border-radius:20px;
    margin-top:8px;
  }

  .tabs{
    display:flex;
    justify-content:center;
    gap:64px;
    border-top:2px solid rgba(255,255,255,.6);
    margin-top:6px;
    transition:border-color .7s ease;
  }
  body.dark .tabs{ border-color:rgba(255,255,255,.12); }
  .tab{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:1px;
    color:#141217;
    padding:14px 4px;
    border-top:2px solid #141217;
    margin-top:-2px;
    transition:color .7s ease, border-color .7s ease;
  }
  body.dark .tab{ color:#fff8ec; border-top-color:#fff8ec; }

  /* ---------- grille de publications ---------- */
  .posts-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
    margin-top:4px;
  }
  @media (max-width:480px){
    .posts-grid{ gap:2px; }
  }
  .post-item{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:linear-gradient(145deg, var(--pink), var(--blue));
    cursor:pointer;
    border:none;
    padding:0;
  }
  .post-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .25s ease;
  }
  .post-item:hover img{ transform:scale(1.06); }
  .post-item .cap-overlay{
    position:absolute;
    inset:0;
    background:rgba(60,20,90,.55);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    font-family:'Montserrat',sans-serif;
    font-size:12px;
    opacity:0;
    transition:opacity .2s ease;
  }
  .post-item:hover .cap-overlay{ opacity:1; }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    font-family:'Montserrat',sans-serif;
    color:#9a95a2;
    transition:color .7s ease;
  }
  body.dark .empty-state{ color:#9a95a2; }
  .empty-state .big{
    font-size:44px;
    margin-bottom:12px;
  }

  .loading-msg{
    text-align:center;
    padding:60px 20px;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    color:#ff208c;
    transition:color .7s ease;
  }
  body.dark .loading-msg{ color:#d8d2e0; }

  footer{
    text-align:center;
    font-family:'Montserrat',sans-serif;
    color:#c80064;
    font-size:13px;
    padding:20px;
    position:relative;
    z-index:2;
    transition:color .7s ease;
  }
  body.dark footer{ color:#b9b3c4; }

  #themeToggle{
    position:fixed;
    top:16px;
    right:16px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.8);
    background:rgba(255,32,140,.35);
    color:#2a2630;
    font-size:17px;
    cursor:pointer;
    z-index:40;
    opacity:.75;
    transition:opacity .2s, transform .3s, background .3s, color .3s;
  }
  #themeToggle:hover{opacity:1; transform:rotate(15deg);}
  body.dark #themeToggle{
    background:rgba(107,127,215,.35);
    color:#f3eee4;
    border-color:rgba(255,255,255,.4);
  }

  /* ---------- lightbox pour voir une publication en grand ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(40,15,70,.75);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
    padding:20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox-card{
    background:#fff;
    border-radius:22px;
    border:4px solid #fff;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    max-width:420px;
    width:100%;
    overflow:hidden;
    position:relative;
    transition:background .7s ease;
  }
  body.dark .lightbox-card{ background:#1e1c24; }
  .lightbox-card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
  }
  .post-item .cap-overlay .like-hint{
    font-size:11px;
    opacity:.9;
  }

  .lightbox-cap{
    padding:14px 18px 6px;
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    color:#141217;
    white-space:pre-wrap;
    transition:color .7s ease;
  }
  body.dark .lightbox-cap{ color:#fff8ec; }
  .lightbox-likes{
    padding:0 18px 18px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .like-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:19px;
    padding:2px 4px;
    line-height:1;
    transition:transform .12s ease;
  }
  .like-btn:active{ transform:scale(1.3); }
  .like-count{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:13px;
    color:#ff208c;
    transition:color .7s ease;
  }
  body.dark .like-count{ color:#d8d2e0; }
  .lightbox-close{
    position:absolute;
    top:10px;right:14px;
    font-size:20px;
    color:#fff;
    background:rgba(0,0,0,.35);
    border:none;
    width:30px;height:30px;
    border-radius:50%;
    cursor:pointer;
  }
</style>

<script>
/* Même client Discord que les autres pages. Si cette page est hébergée sur une
   URL différente, ajoute-la dans OAuth2 > Redirects sur
   https://discord.com/developers/applications */
const DISCORD_CLIENT_ID = '1005172482539524286';

const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAZWsfrqCrmDFyvG5RNdQacEUbkAq2qXqM',
  authDomain: 'chibi-be98b.firebaseapp.com',
  databaseURL: 'https://chibi-be98b-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'chibi-be98b',
  storageBucket: 'chibi-be98b.firebasestorage.app'
};

let db = null;
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}catch(e){ db = null; }

let discordUser = null;
let currentChibiId = null;

function getRedirectUri(){
  return window.location.origin + window.location.pathname;
}

function startDiscordLogin(){
  ChibiAuth.login();
}

async function handleDiscordRedirect(){
  await ChibiAuth.handleRedirect();
}

const mainEl = document.getElementById('main');

function getChibiIdFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

function chibiImage(id, customChibis){
  return customChibis[id] || (typeof BASE_CHIBI_DATA !== 'undefined' ? BASE_CHIBI_DATA[id] : null) || '';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadDiscordUser(){
  // verified identity from the Firebase session (members of the Discord server only)
  discordUser = await ChibiAuth.current();
  if(!discordUser) ChibiAuth.gate();
}

function renderNotFound(){
  mainEl.innerHTML = `
    <div class="empty-state">
      <div class="big">🔍</div>
      Profil introuvable ✧<br>
      Ce chibi n'a peut-être pas encore été adopté, ou le lien est invalide.<br><br>
      <a class="backlink" href="index.html">← retour à l'accueil</a>
    </div>`;
}

async function renderProfile(){
  const chibiId = getChibiIdFromUrl();
  if(!chibiId){ renderNotFound(); return; }
  currentChibiId = chibiId;

  if(!db){
    mainEl.innerHTML = '<div class="empty-state"><div class="big">⚠</div>la base de données n\u2019est pas accessible pour le moment.</div>';
    return;
  }

  const [aSnap, cSnap, hSnap, pSnap, bSnap] = await Promise.all([
    db.ref('assignments/' + chibiId).get().catch(()=>null),
    db.ref('customChibis').get().catch(()=>null),
    db.ref('hiddenChibis/' + chibiId).get().catch(()=>null),
    db.ref('posts/' + chibiId).get().catch(()=>null),
    db.ref('profiles/' + chibiId + '/bio').get().catch(()=>null),
  ]);

  const entry = aSnap && aSnap.exists() ? aSnap.val() : null;
  const isHidden = hSnap && hSnap.exists() ? hSnap.val() : false;

  if(!entry || isHidden){
    renderNotFound();
    return;
  }

  const customChibis = cSnap && cSnap.exists() ? cSnap.val() : {};
  const img = chibiImage(chibiId, customChibis);
  const username = entry.discordUsername || entry.name || 'quelqu\u2019un';
  const discordId = entry.discordId;
  const customBio = bSnap && bSnap.exists() ? bSnap.val() : '';
  const bioText = customBio && customBio.trim()
    ? customBio
    : '✧ membre de la communauté TWEWY Co-op ✧\na adopté ce chibi pour toujours.';

  const postsRaw = pSnap && pSnap.exists() ? pSnap.val() : {};
  const posts = Object.entries(postsRaw)
    .map(([postId, p]) => ({ postId, ...p }))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  const isOwnProfile = !!(discordUser && discordId && discordUser.id === discordId);

  // same layout as the launcher: numbered sticker panels, PROFIL (avatar, level, XP, achievements list) next to
  // PUBLICATIONS, then CLASSEMENT (daily mission, day by day) next to HISTORIQUE (this player's last 7 missions)
  const panel = (num, title, body, cls) => `
    <section class="lp-panel ${cls || ''}">
      <div class="lp-chip"><i>${num}</i>${title}</div>
      <div class="lp-win"><b></b><b></b></div><div class="lp-tape"></div>
      ${body}
    </section>`;
  mainEl.classList.add('lp-main');
  mainEl.innerHTML = `
    <div class="lp-grid">
      ${panel('05', 'PROFIL', `
        <div class="lp-head">
          <div class="avatar-ring">
            <div class="avatar-inner">${img ? `<img src="${img}" alt="${escapeHtml(username)}">` : '🌸'}</div>
          </div>
          <div class="lp-meta">
            <div class="lp-name-row">
              <span class="lp-name">@${escapeHtml(username)}</span>
              ${discordId ? `<a class="lp-btn" href="https://discord.com/users/${encodeURIComponent(discordId)}" target="_blank" rel="noopener">DISCORD ▸</a>` : ''}
            </div>
            <div class="lp-level" id="lpLevel">NIVEAU –</div>
            <div class="lp-xp" id="lpXp"><i style="width:0"></i><span>chargement…</span></div>
            <div class="lp-stats" id="lpStats"></div>
          </div>
        </div>
        <div class="lp-bio">${escapeHtml(bioText)}${isOwnProfile ? ` <a class="lp-edit" href="dashboard.html">✏️ modifier</a>` : ''}</div>
        <div id="lpAch" class="lp-fill"><div class="lp-list"><div class="lp-body"><div class="lp-empty">chargement…</div></div></div></div>
      `, 'lp-profile')}
      ${panel('06', 'PUBLICATIONS', `<div class="lp-dark lp-fill"><div id="postsWrap"></div></div>`, 'lp-posts')}
      ${panel('07', 'CLASSEMENT', `
        <div class="lp-daynav">
          <button type="button" class="lp-arrow" id="lpPrev" title="jour précédent">◀</button>
          <span id="lpDay">Aujourd'hui</span>
          <button type="button" class="lp-arrow" id="lpNext" title="jour suivant">▶</button>
        </div>
        <div id="lpBoard" class="lp-fill"></div>
        <div class="lp-foot" id="lpBoardFoot"></div>
      `, 'lp-board')}
      ${panel('08', 'HISTORIQUE', `<div id="lpHist" class="lp-fill"></div><div class="lp-foot" id="lpHistFoot"></div>`, 'lp-hist')}
    </div>
  `;

  if (discordId && window.CoopProgress){
    CoopProgress.load(db, discordId).then(data => {
      const st = CoopProgress.stats(data);
      if (st){
        document.getElementById('lpLevel').textContent = 'NIVEAU ' + st.lv;
        const xp = document.getElementById('lpXp');
        xp.querySelector('i').style.width = Math.round(st.into * 100 / st.need) + '%';
        xp.querySelector('span').textContent = st.into + ' / ' + st.need + ' XP';
        document.getElementById('lpStats').textContent = st.n + ' / ' + st.total + ' succès  ·  ' + st.xp + ' XP' + (st.updated ? '  ·  màj ' + CoopProgress.ago(st.updated) : '');
      } else {
        document.getElementById('lpLevel').textContent = 'NIVEAU 1';
        document.getElementById('lpXp').querySelector('span').textContent = '0 / 200 XP';
        document.getElementById('lpStats').textContent = 'pas encore de profil de jeu publié';
      }
      document.getElementById('lpAch').innerHTML = CoopProgress.achList(data);
      document.getElementById('lpHist').innerHTML = CoopProgress.historyList(data, discordId);
      const played = data.days.filter(d => d.rows.some(r => r.id === discordId)).length;
      document.getElementById('lpHistFoot').textContent = played + ' mission' + (played > 1 ? 's' : '') + ' sur les 7 derniers jours';
      let day = 0;
      const showDay = () => {
        const d = data.days[day];
        document.getElementById('lpDay').textContent = CoopProgress.dayLabel(d);
        document.getElementById('lpBoard').innerHTML = CoopProgress.boardList(d, discordId, data.chibiOf);
        document.getElementById('lpPrev').disabled = day >= data.days.length - 1;
        document.getElementById('lpNext').disabled = day === 0;
        const i = d.rows.findIndex(r => r.id === discordId);
        document.getElementById('lpBoardFoot').textContent = d.rows.length + ' joueur' + (d.rows.length > 1 ? 's' : '') + ' classé' + (d.rows.length > 1 ? 's' : '') + (i >= 0 ? '  ·  @' + username + ' est #' + (i + 1) : '');
      };
      document.getElementById('lpPrev').onclick = () => { if (day < data.days.length - 1){ day++; showDay(); } };
      document.getElementById('lpNext').onclick = () => { if (day > 0){ day--; showDay(); } };
      showDay();
    }).catch(() => { document.getElementById('lpAch').innerHTML = '<div class="lp-empty">progression indisponible pour le moment.</div>'; });
  }

  const postsWrap = document.getElementById('postsWrap');

  if(posts.length === 0){
    postsWrap.innerHTML = `
      <div class="empty-state">
        <div class="big">📷</div>
        Aucune publication pour l'instant ✧
        ${isOwnProfile ? '<br><br><a class="backlink" href="dashboard.html">→ publier quelque chose</a>' : ''}
      </div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'posts-grid';
  posts.forEach(p => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'post-item';

    if(p.image){
      const pimg = document.createElement('img');
      pimg.src = p.image;
      pimg.alt = p.caption || '';
      item.appendChild(pimg);
    }

    const likeCount = Object.keys(p.likes || {}).length;
    const cap = document.createElement('div');
    cap.className = 'cap-overlay';
    cap.innerHTML = `
      ${p.caption ? escapeHtml(p.caption) : ''}
      <span class="like-hint">❤ ${likeCount}</span>
    `;
    item.appendChild(cap);

    item.addEventListener('click', () => openLightbox(p));
    grid.appendChild(item);
  });

  postsWrap.innerHTML = '';
  postsWrap.appendChild(grid);
}

/* ---------- lightbox + likes ---------- */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCap = document.getElementById('lightboxCap');
const lightboxLikeBtn = document.getElementById('lightboxLikeBtn');
const lightboxLikeCount = document.getElementById('lightboxLikeCount');
let currentLightboxPostId = null;

function refreshLikeUI(likes){
  const count = Object.keys(likes || {}).length;
  const isLiked = !!(discordUser && likes && likes[discordUser.id]);
  lightboxLikeCount.textContent = count;
  lightboxLikeBtn.textContent = isLiked ? '❤️' : '🤍';
}

function openLightbox(p){
  lightboxImg.src = p.image || '';
  lightboxCap.textContent = p.caption || '';
  currentLightboxPostId = p.postId;
  refreshLikeUI(p.likes || {});
  lightbox.classList.add('open');
}
document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('open'));
lightbox.addEventListener('click', (e) => { if(e.target === lightbox) lightbox.classList.remove('open'); });

lightboxLikeBtn.addEventListener('click', async () => {
  if(!db || !currentChibiId || !currentLightboxPostId) return;
  if(!discordUser){ startDiscordLogin(); return; }
  const likeRef = db.ref('posts/' + currentChibiId + '/' + currentLightboxPostId + '/likes/' + discordUser.id);
  try{
    const snap = await likeRef.get().catch(()=>null);
    const alreadyLiked = !!(snap && snap.exists());
    if(alreadyLiked){ await likeRef.remove(); }
    else{ await likeRef.set(true); }

    const allSnap = await db.ref('posts/' + currentChibiId + '/' + currentLightboxPostId + '/likes').get().catch(()=>null);
    const allLikes = allSnap && allSnap.exists() ? allSnap.val() : {};
    refreshLikeUI(allLikes);
  }catch(e){ /* ignore */ }
});

/* ---------- thème clair / sombre (partagé) ---------- */
const themeToggle = document.getElementById('themeToggle');
function applyTheme(dark){
  document.body.classList.toggle('dark', dark);
  themeToggle.textContent = dark ? '☀' : '🌙';
  themeToggle.title = dark ? 'mode clair' : 'mode sombre';
  try{ localStorage.setItem('theme', dark ? 'dark' : 'light'); }catch(e){}
}
themeToggle.addEventListener('click', () => {
  applyTheme(!document.body.classList.contains('dark'));
});
let savedTheme = null;
try{ savedTheme = localStorage.getItem('theme'); }catch(e){}
applyTheme(savedTheme === 'dark');

/* ---------- étoiles décoratives (partagées) ---------- */
const sparkleChars = ['★','✦','✧','☆','✶'];
for(let i=0;i<20;i++){
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.textContent = sparkleChars[i % sparkleChars.length];
  s.style.left = Math.random()*100 + 'vw';
  s.style.top = Math.random()*100 + 'vh';
  s.style.animationDelay = (Math.random()*6) + 's';
  s.style.animationDuration = (4 + Math.random()*5) + 's';
  s.style.fontSize = (14 + Math.random()*24) + 'px';
  document.body.appendChild(s);
}

async function init(){
  await handleDiscordRedirect();
  await loadDiscordUser();
  await renderProfile();
}
init();
</script>
